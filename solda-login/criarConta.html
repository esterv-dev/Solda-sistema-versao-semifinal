<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta</title>

  <link rel="stylesheet" href="./criarconta.css">
</head>

<body>

<div class="container">

  <h1>Criar Conta</h1>

  <input
    type="text"
    id="nome"
    placeholder="Digite seu nome completo"
  >

  <input
    type="text"
    id="cpf"
    placeholder="Digite seu CPF"
  >

  <input
  type="text"
  id="empresa"
  placeholder="Digite o nome da empresa"
>

  <input
    type="email"
    id="email"
    placeholder="Digite seu email"
  >

  <input
    type="password"
    id="senha"
    placeholder="Crie uma senha"
  >

  <button id="btnCadastrar">
    Criar Conta
  </button>

  <button id="btnVoltar">
    Voltar
  </button>

  <p id="mensagem"></p>

</div>

<script type="module" src="criarConta.js"></script>

</body>
</html>
